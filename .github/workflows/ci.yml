name: CI

# Static verification on every push / PR. The audit found tests/ existed but had no
# npm script and no CI, so nothing ran automatically and regressions were only caught
# by hand. Runtime API tests need live Firebase + JWT secrets, so they are NOT run
# here — this job covers what can be verified without secrets.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Pin the registry for anything this job resolves. NOTE: this alone does
          # NOT fix a lockfile that already points elsewhere — `npm ci` fetches each
          # package's `resolved` URL verbatim and ignores --registry. The lockfile
          # itself has to be correct; see the guard step below.
          registry-url: "https://registry.npmjs.org/"

      # Fail in two seconds with an actionable message instead of dying inside
      # `npm ci` with a DNS error. An `npm install` run inside Replit rewrites
      # `resolved` to http://package-firewall.replit.local/..., a host that exists
      # only on Replit's network — the runner cannot reach it and the job dies at
      # the install step before a single test runs. It is a one-line change buried
      # in a 20,000-line lockfile and looks completely normal locally.
      - name: Check the lockfile resolves to the public registry
        run: |
          # Note the assignment rather than `if grep ... | head`: `head` exits 0 even
          # when nothing matched, so a pipeline ending in it would report a failure
          # on every run.
          offenders=$(grep -n '"resolved": "' package-lock.json \
                        | grep -v '"resolved": "https://registry.npmjs.org/' || true)
          if [ -n "$offenders" ]; then
            echo "$offenders" | head -20
            echo ""
            echo "::error::package-lock.json resolves packages from a non-public registry (see above)."
            echo "This is what an 'npm install' inside Replit writes. Regenerate with:"
            echo "  npm install --package-lock-only --registry https://registry.npmjs.org/"
            exit 1
          fi
          echo "all resolved URLs point at registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Typecheck
        run: npm run check:types

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        # Settlement-consistency tests run against an in-memory Firestore double,
        # so they need no credentials and are safe to gate CI on.
        run: npm run test:unit

      - name: Build server bundle
        run: npm run server:build

      - name: Boot smoke test
        # Proves the bundle actually starts (catches missing imports / top-level
        # throws that typecheck cannot see). Uses a throwaway secret; without
        # FIREBASE_SERVICE_ACCOUNT the server runs in degraded mode but must not crash.
        run: |
          JWT_SECRET=ci-smoke-secret-not-a-real-secret NODE_ENV=production PORT=5599 \
            node server_dist/index.js &
          SERVER_PID=$!
          sleep 6
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "server is up"
            kill "$SERVER_PID"
          else
            echo "server exited during boot"
            exit 1
          fi
